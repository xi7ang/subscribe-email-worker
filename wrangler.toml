name = "subscribe-email-worker"
main = "src/index.ts"
compatibility_date = "2024-06-14"

[vars]
RESEND_FROM_EMAIL = "devmini <noreply@resend.dev>"

# KV namespace - must be created manually in Cloudflare dashboard first,
# then bind via dashboard (not via toml env var substitution)
# GitHub Secrets: RESEND_API_KEY, TURNSTILE_SECRET_KEY

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
