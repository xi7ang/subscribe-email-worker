name = "subscribe-email-resend-worker"
main = "src/index.ts"
compatibility_date = "2024-06-14"

[vars]
RESEND_FROM_EMAIL = "devmini <noreply@resend.dev>"

# GitHub Secrets: RESEND_API_KEY, TURNSTILE_SECRET_KEY, CLOUDFLARE_KV_NAMESPACE_ID

[[kv_namespaces]]
binding = "SUBSCRIBE_KV"
id = "${CLOUDFLARE_KV_NAMESPACE_ID}"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
